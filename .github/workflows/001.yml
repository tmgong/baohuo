name: Keep InfinityFree Alive
on:
  schedule:
    # cron: 分 时 日 月 星期
    # UTC时间 0点 = 北京时间早上8点，每天执行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 可以手动点按钮立刻测试运行

jobs:
  visit:
    runs-on: ubuntu-latest
    steps:
      - name: 访问你的PHP接口(act=load)
        run: |
          curl -s -o /dev/null -w "HTTP_CODE:%{http_code}" https://tmgong.ct.ws/jh.php?act=load
